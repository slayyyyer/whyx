# Pokes the demo so Render's free instance does not fall asleep after 15 idle minutes. The address
# is the live service; set the SITE_URL repository variable to point the keepalive somewhere else.
name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the demo
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://whyx-sxzp.onrender.com/' }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -m 90 --retry 2 --retry-delay 15 --retry-all-errors "$SITE_URL")
          echo "$SITE_URL answered $code"
          [ "$code" = "200" ]
